name: Exécuter notebook Kaggle

on:
  workflow_dispatch:
    inputs:
      notebook_slug:
        description: "Notebook Kaggle à exécuter"
        required: false
        default: "mkawarhoussem/promptfoo-ollama-yimchi-mrigil-hamdoulah"
        type: string
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 2 * * *"

jobs:
  run-kaggle-notebook:
    name: Kaggle GPU Run
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kaggle API
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json << EOF
          {
            "username":"${{ secrets.KAGGLE_USERNAME }}",
            "key":"${{ secrets.KAGGLE_KEY }}"
          }
          EOF
          chmod 600 ~/.kaggle/kaggle.json

      - name: Push notebook to Kaggle
        run: |
          echo "🚀 Pushing notebook to Kaggle..."
          kaggle kernels push -p mon-notebook
          echo ""
          echo "✅ Push completed successfully!"
          echo ""
          echo "📌 Le notebook est maintenant sur Kaggle"
          echo "🔗 https://www.kaggle.com/code/${{ secrets.KAGGLE_USERNAME }}/promptfoo-ollama-yimchi-mrigil-hamdoulah"

      - name: Summary
        run: |
          {
            echo "## 🚀 Notebook pushed to Kaggle"
            echo ""
            echo "**Status:** ✅ Push successful"
            echo "**Date:** $(date)"
            echo ""
            echo "### 📌 Next steps"
            echo "1. Go to Kaggle notebook:"
            echo "   https://www.kaggle.com/code/${{ secrets.KAGGLE_USERNAME }}/promptfoo-ollama-yimchi-mrigil-hamdoulah"
            echo ""
            echo "2. Wait for execution to complete"
            echo ""
            echo "3. Download results from the **Output** tab"
            echo ""
            echo "4. Run MLflow locally:"
            echo "   \`\`\`bash"
            echo "   cd /path/to/downloaded/results"
            echo "   mlflow ui --backend-store-uri file://./mlflow_tracking"
            echo "   \`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"