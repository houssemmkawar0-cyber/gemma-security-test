name: 🚀 Exécuter notebook Kaggle

on:
  workflow_dispatch:
    inputs:
      notebook_slug:
        description: "Notebook Kaggle à exécuter"
        required: false
        default: "mkawarhoussem/promptfoo-ollama-yimchi-mrigil-hamdoulah"
        type: string

  push:
    branches: [ main, master ]

  schedule:
    - cron: "0 2 * * *"

jobs:
  run-kaggle-notebook:
    name: 🏃 Kaggle GPU Run
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================
      # 1. Checkout repo
      # =========================
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Kaggle setup
      # =========================
      - name: 🔧 Setup Kaggle API
        run: |
          pip install kaggle --upgrade

          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      # =========================
      # 3. Préparer metadata depuis template
      # =========================
      - name: 📋 Préparer metadata depuis template
        run: |
          cp mon-notebook/kernel-metadata.template.json \
             mon-notebook/kernel-metadata.json

          echo "✅ metadata.json créé depuis template"

      # =========================
      # 4. Inject GROQ API KEY
      # =========================
      - name: 🔑 Inject GROQ_API_KEY
        run: |
          sed -i "s|PLACEHOLDER_GROQ|${{ secrets.GROQ_API_KEY }}|g" \
            mon-notebook/kernel-metadata.json

          if grep -q "PLACEHOLDER_GROQ" mon-notebook/kernel-metadata.json; then
            echo "❌ Injection échouée"
            exit 1
          fi

          echo "✅ GROQ_API_KEY injectée"

      # =========================
      # 5. Push vers Kaggle
      # =========================
      - name: 🚀 Push notebook to Kaggle
        run: |
          echo "🚀 Pushing notebook..."
          kaggle kernels push -p mon-notebook

      # =========================
      # 6. Attente exécution
      # =========================
      - name: ⏳ Wait Kaggle execution
        run: |
          NOTEBOOK="${{ github.event.inputs.notebook_slug }}"

          echo "⏳ Monitoring: $NOTEBOOK"

          for i in {1..120}; do
            STATUS=$(kaggle kernels status $NOTEBOOK 2>&1)
            echo "[$i/120] $STATUS"

            STATUS_LC=$(echo "$STATUS" | tr '[:upper:]' '[:lower:]')

            if echo "$STATUS_LC" | grep -q "complete"; then
              echo "✅ SUCCESS"
              break
            fi

            if echo "$STATUS_LC" | grep -q "error"; then
              echo "❌ FAILED"
              exit 1
            fi

            sleep 30
          done

      # =========================
      # 7. Download results
      # =========================
      - name: 📥 Download results
        run: |
          NOTEBOOK="${{ github.event.inputs.notebook_slug }}"

          mkdir -p ./results
          kaggle kernels output $NOTEBOOK -p ./results/

          ls -la ./results/

      # =========================
      # 8. Upload artifacts
      # =========================
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-results
          path: ./results/
          retention-days: 30

      # =========================
      # 9. Summary
      # =========================
      - name: 📊 Summary
        run: |
          echo "## 🚀 Kaggle Run Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Notebook:** ${{ github.event.inputs.notebook_slug }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY