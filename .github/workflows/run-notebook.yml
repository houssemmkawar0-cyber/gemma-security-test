name: 🚀 Exécuter notebook Kaggle

on:
  workflow_dispatch:
    inputs:
      notebook_slug:
        description: "Notebook Kaggle à exécuter"
        required: false
        default: "mkawarhoussem/promptfoo-ollama-yimchi-mrigil-hamdoulah"
        type: string

  push:
    branches: [ main, master ]

  schedule:
    - cron: "0 2 * * *"

jobs:
  run-kaggle-notebook:
    name: 🏃 Kaggle GPU Run
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Kaggle API
        run: |
          pip install kaggle --upgrade
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: 🚀 Push notebook to Kaggle
        run: |
          kaggle kernels push -p mon-notebook

      # =========================
      # NOUVEAU : attendre RUNNING
      # puis récupérer l'URL ngrok
      # sans attendre COMPLETE
      # =========================
      - name: ⏳ Attendre que MLflow URL soit disponible
        id: mlflow
        run: |
          NOTEBOOK="${{ github.event.inputs.notebook_slug || 'mkawarhoussem/promptfoo-ollama-yimchi-mrigil-hamdoulah' }}"
          MLFLOW_URL=""

          echo "⏳ Attente que le notebook démarre et crée mlflow_url.txt..."

          for i in {1..60}; do
            STATUS=$(kaggle kernels status $NOTEBOOK 2>&1)
            STATUS_LC=$(echo "$STATUS" | tr '[:upper:]' '[:lower:]')
            echo "[$i/60] $STATUS"

            # Dès que RUNNING → essayer de télécharger mlflow_url.txt
            if echo "$STATUS_LC" | grep -q "running"; then

              # Attendre 3 min que ngrok démarre dans le notebook
              if [ $i -eq 10 ]; then
                echo "🔄 Notebook running — tentative récupération URL..."
                mkdir -p ./results

                # Télécharger les outputs disponibles
                kaggle kernels output $NOTEBOOK -p ./results/ 2>/dev/null || true

                if [ -f "./results/mlflow_url.txt" ]; then
                  MLFLOW_URL=$(cat ./results/mlflow_url.txt)
                  echo "✅ URL MLflow récupérée : $MLFLOW_URL"
                  echo "url=$MLFLOW_URL" >> $GITHUB_OUTPUT
                  break
                fi
              fi

              # Retry toutes les 30s après i=10
              if [ $i -gt 10 ] && [ $((i % 3)) -eq 0 ]; then
                echo "🔄 Retry récupération URL..."
                mkdir -p ./results
                kaggle kernels output $NOTEBOOK -p ./results/ 2>/dev/null || true

                if [ -f "./results/mlflow_url.txt" ]; then
                  MLFLOW_URL=$(cat ./results/mlflow_url.txt)
                  echo "✅ URL MLflow récupérée : $MLFLOW_URL"
                  echo "url=$MLFLOW_URL" >> $GITHUB_OUTPUT
                  break
                fi
              fi
            fi

            # Si COMPLETE sans avoir trouvé l'URL
            if echo "$STATUS_LC" | grep -q "complete"; then
              echo "⚠️ Notebook terminé avant récupération URL"
              break
            fi

            sleep 30
          done

          if [ -z "$MLFLOW_URL" ]; then
            echo "url=" >> $GITHUB_OUTPUT
          fi

      # =========================
      # Summary avec lien cliquable
      # =========================
      - name: 📊 Summary + lien MLflow
        run: |
          MLFLOW_URL="${{ steps.mlflow.outputs.url }}"

          echo "## 🚀 Kaggle Notebook En Cours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$MLFLOW_URL" ]; then
            echo "## 🌐 MLflow — Clique maintenant !" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 👉 [OUVRIR MLFLOW]($MLFLOW_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Page | Lien |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🏠 Accueil | [$MLFLOW_URL]($MLFLOW_URL) |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Experiments | [$MLFLOW_URL/#/experiments]($MLFLOW_URL/#/experiments) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔬 Runs | [$MLFLOW_URL/#/experiments/1/runs]($MLFLOW_URL/#/experiments/1/runs) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ Le notebook Kaggle tourne encore en arrière-plan" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ URL MLflow non disponible" >> $GITHUB_STEP_SUMMARY
          fi