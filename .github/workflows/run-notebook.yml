name: 🚀 Exécuter notebook Kaggle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  run-kaggle-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Kaggle API
        run: |
          pip install kaggle --upgrade
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: 🚀 Push notebook
        run: |
          echo "🚀 Pushing notebook..."
          kaggle kernels push -p ./mon-notebook
          echo "✅ Push completed!"

      # PAS DE MONITORING - supprimé volontairement

      - name: 📥 Download results
        continue-on-error: true
        run: |
          NOTEBOOK="${{ secrets.KAGGLE_USERNAME }}/promptfoo-ollama-yimchi-mrigil-hamdoulah"
          mkdir -p ./results
          kaggle kernels output $NOTEBOOK -p ./results/ || echo "No results"
          ls -la ./results/

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ./results/
          if-no-files-found: warn

      - name: 📊 Summary
        run: |
          echo "✅ Notebook pushed successfully!" >> $GITHUB_STEP_SUMMARY